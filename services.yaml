# Which model and vendor fills each slot of a call. The LLM is always OpenRouter, so only its model
# is chosen. Any Pipecat STT or TTS service can fill a speech slot: name its class and its settings.
# Each slot names the environment variable holding its API key; secrets stay in .env.
# The Brief sets each call's language, and picks its voice from `voices`, over anything under
# `settings`. Read from the working directory, like .env; edit it to try a different setup.

llm:
  model: openai/gpt-5.6-terra
  api_key_env: OPENROUTER_API_KEY

stt:
  service: pipecat.services.deepgram.stt.DeepgramSTTService
  api_key_env: DEEPGRAM_API_KEY
  settings:
    model: nova-3
    interim_results: true
    profanity_filter: true
    smart_format: true

