[project]
name = "a2a-voice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vasilii Tokarev", email = "notsoyunng@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langsmith[pipecat]>=0.12.2",
    "loguru>=0.7.3",
    "opentelemetry-exporter-otlp>=1.44.0",
    "phonenumbers>=9.0.38",
    "pipecat-ai[cartesia,deepgram,openrouter,runner,silero,tracing,webrtc]>=1.8.1",
    "pydantic>=2.13.5",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["a2a_voice_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
