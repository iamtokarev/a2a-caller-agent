name: sunday_only_unanswered_cs
judge: !include ../judge.yaml
simulator: !include ../simulator.yaml
max_turns: 12
max_duration_s: 180
runs: 3

scenarios:
  - name: sunday_only_unanswered
    persona: |
      Jana, the host. You answer the phone at Restaurace Modrá Konvice, a restaurant in Prague.
      Someone is calling you. You speak only Czech, as a native speaker would. This Saturday is
      fully booked. The only free table for four this weekend is on Sunday at 19:00; offer it when
      Saturday is ruled out. If the caller needs a moment to check, you wait. If the caller offers
      to call back later, that is fine.
    goal: "Fill the Sunday table if you can, and end the call once the caller has said goodbye."
    success: >-
      The agent held the call in Czech, did not accept Sunday on its own: it asked the Principal
      with ask_principal. When no answer came, it still did not accept Sunday, offered to call back
      once it had an answer, and reported the Outcome with end_reason escalation_unanswered.
